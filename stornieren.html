<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Termin stornieren | Pasing Wellness</title><style>body{margin:0;background:#f7f2e9;color:#3e2c24;font-family:Arial,sans-serif;display:grid;min-height:100vh;place-items:center}.card{width:min(560px,90%);background:#fffdf9;border:1px solid #ded2c1;padding:42px;box-shadow:0 18px 45px rgba(55,37,28,.09)}h1{font:normal 40px Georgia,serif;margin:0 0 18px}.btn{border:0;background:#b58b4c;color:white;padding:15px 22px;text-transform:uppercase;letter-spacing:1.4px;cursor:pointer}.btn:disabled{opacity:.5}.msg{margin:20px 0}.back{display:inline-block;margin-top:20px;color:#806e61}</style></head><body><main class="card"><div style="letter-spacing:3px;text-transform:uppercase;font-size:11px;color:#b58b4c">Pasing Wellness</div><h1>Termin stornieren</h1><p>Eine Online-Stornierung ist bis 24 Stunden vor Ihrem Termin möglich.</p><div class="msg" id="msg">Möchten Sie Ihren Termin wirklich stornieren?</div><button class="btn" id="cancelBtn">Termin stornieren</button><br><a class="back" href="/">← Zurück zu Pasing Wellness</a></main><script>const token=new URLSearchParams(location.search).get('token');const btn=document.getElementById('cancelBtn'),msg=document.getElementById('msg');if(!token){msg.textContent='Der Stornierungslink ist ungültig.';btn.disabled=true}btn.onclick=async()=>{btn.disabled=true;btn.textContent='Wird storniert …';try{const r=await fetch('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Stornierung nicht möglich.');msg.innerHTML='<strong>Ihr Termin wurde storniert.</strong><br>Der Zeitraum ist wieder für andere Kunden freigegeben.';btn.remove()}catch(e){msg.textContent=e.message;btn.disabled=false;btn.textContent='Termin stornieren'}};</script></body></html>
